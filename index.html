<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xenon High-precision macros for Geometry Dash</title>
    <meta
      name="description"
      content="Xenon is a lightweight Geode mod for Geometry Dash with CBF, a macro editor, frame stepper, and built-in timing tools."
    />
    <meta name="author" content="Kernel" />
    <meta name="theme-color" content="#0c0e13" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xenon High-precision macros for Geometry Dash" />
    <meta
      property="og:description"
      content="Record inputs, replay with CBF, and refine every frame in one lightweight Geode mod."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem("xenon-theme");
          const systemLight = window.matchMedia("(prefers-color-scheme: light)")
            .matches;
          const theme = stored === "light" || stored === "dark"
            ? stored
            : systemLight
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <style>
      html {
        background: #0c0e13;
      }
      html[data-theme="light"] {
        background: #f8f8fc;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
